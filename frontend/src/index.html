<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Chronicle</title>
    <base href="/" />
    <meta name="theme-color" content="#1b1f1d" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="content/assets/app-icon/favicon.ico" />
    <link rel="apple-touch-icon" href="content/assets/app-icon/icon-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script>
      // Light or dark paper before the first paint (the app keeps it up to date).
      try {
        var t = JSON.parse(localStorage.getItem('chronicle.settings') || '{}').theme;
        if (t !== 'light' && t !== 'dark')
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <cr-root></cr-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
