name: Bug report
description: Something in the app doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Issues are public – please don't quote longer story passages or name endings.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message
      description: Shown by the app, if there was one.
      render: text
  - type: input
    id: where
    attributes:
      label: Where in the app?
      description: Screen or passage, filled in automatically when you report from the app.
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. Android tablet, Chrome
