# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  PROJECT_NAME: chronicle
  APP_VERSION: "0.3.0" # x-release-please-version

  DEFAULT_IMAGE_NAME: "{{.PROJECT_NAME}}:{{.APP_VERSION}}"
  # docker or podman
  CONTAINER_ENGINE: '{{.CONTAINER_ENGINE | default "docker"}}'
  # The original files the converter reads (see sources/README.md).
  SOURCES_DIR: '{{joinPath .ROOT_DIR "sources/original"}}'
  # Optional full clone of the fan repository, only needed to re-extract the screen texts.
  UPSTREAM_DIR: '{{joinPath .ROOT_DIR "upstream/UnityOriginalApp"}}'

tasks:
  # Dependencies
  deps:install:
    desc: Install all workspace dependencies (npm ci in CI).
    sources: ["package.json", "package-lock.json", "*/package.json"]
    generates: ["node_modules/.package-lock.json"]
    cmds:
      - '{{if .CI}}npm ci{{else}}npm install{{end}}'

  # Docker
  project:build:docker:
    desc: Build the production image.
    vars:
      IMAGE_NAME: '{{.IMAGE_NAME | default .DEFAULT_IMAGE_NAME}}'
    sources: ["Containerfile", "docker/**/*", "package-lock.json", "engine/**/*", "frontend/**/*", "content/**/*"]
    generates: [.docker_image_marker.lock]
    cmds:
      # Podman's default OCI format drops HEALTHCHECK; the docker format keeps it.
      - "{{.CONTAINER_ENGINE}} build --file Containerfile {{if eq .CONTAINER_ENGINE \"podman\"}}--format docker {{end}}--tag {{.IMAGE_NAME}} --target runtime ."
      - touch .docker_image_marker.lock

  project:up:prod:
    desc: "Run the production image locally with Docker Compose (vars: PORT, default 8080)."
    deps:
      - task: project:build:docker
    cmd: IMAGE_NAME="{{.DEFAULT_IMAGE_NAME}}" PORT="{{.PORT | default "8080"}}" {{.CONTAINER_ENGINE}} compose up -d

  project:down:prod:
    desc: Stop the locally running production container.
    cmd: IMAGE_NAME="{{.DEFAULT_IMAGE_NAME}}" {{.CONTAINER_ENGINE}} compose down

  # Project
  project:check:
    desc: "Everything CI checks: types, unit tests, app build, story tester."
    deps: [deps:install]
    cmds:
      - npx tsc -b
      - npm test
      - task: frontend:test
      - task: frontend:build
      - task: content:test

  # Frontend
  frontend:content:
    internal: true
    desc: Copy the content the app serves (scenario data, screen texts, assets, changelog) into frontend/public/content (git-ignored).
    sources: ["content/*/scenario.json", "content/*/strings.en.json", "content/*/extras.json", "content/ui.en.json", "content/assets/**/*", "CHANGELOG.md"]
    generates: ["frontend/public/content/**/*"]
    cmds:
      - rm -rf frontend/public/content
      - mkdir -p frontend/public/content
      - for f in content/*/scenario.json content/*/strings.en.json content/*/extras.json; do mkdir -p "frontend/public/$(dirname "$f")" && cp "$f" "frontend/public/$f"; done
      - cp content/ui.en.json frontend/public/content/
      - cp -r content/assets frontend/public/content/
      # The app's "What's new" page reads it, also offline.
      - cp CHANGELOG.md frontend/public/content/changelog.md

  frontend:serve:dev:
    desc: Serve the app with live reload (ng serve).
    deps: [deps:install, frontend:content]
    dir: frontend
    cmd: npx ng serve

  frontend:build:
    desc: "Production build into build/web (BASE_HREF: path the app is served under, e.g. /chronicle/)."

    deps: [deps:install, frontend:content]
    dir: frontend
    vars:
      OUTPUT_DIR: '{{.OUTPUT_DIR | default (joinPath .ROOT_DIR "build/web")}}'
      BASE_HREF: '{{.BASE_HREF | default "/"}}'
    label: frontend:build:{{.BASE_HREF}}
    sources: ["src/**/*", "public/**/*", "angular.json", "ngsw-config.json", "../engine/src/**/*.ts", "../package-lock.json"]
    generates: ["{{.OUTPUT_DIR}}/browser/index.html"]
    cmd: npx ng build --configuration=production --output-path="{{.OUTPUT_DIR}}" --base-href="{{.BASE_HREF}}"

  frontend:test:
    desc: Unit tests of the app (Vitest).
    deps: [deps:install]
    dir: frontend
    cmd: npx ng test --watch=false

  frontend:e2e:
    desc: "Play a whole game in headless Chrome against the production build (CHROME_PATH, SHOTS=<dir> for screenshots)."
    deps: [frontend:build]
    cmd: node tools/e2e/src/full-game.ts --build build/web/browser {{if .SHOTS}}--shots {{.SHOTS}}{{end}}

  # Content
  content:convert:
    desc: "Convert the original story scripts in sources/ into content/ (IDS: scenario ids; screen texts too if upstream/ is cloned)."
    deps: [deps:install]
    vars:
      IDS: '{{.IDS | default "cost-of-disease"}}'
    cmds:
      - node tools/converter/src/cli.ts --upstream {{.SOURCES_DIR}} --out content --reports build/reports {{.IDS}}
      # The screen texts need the whole Unity project; content/ui.en.json is complete for all scenarios.
      - |
        if [ -d "{{.UPSTREAM_DIR}}" ]; then
          node tools/converter/src/ui-text.ts --upstream "{{.UPSTREAM_DIR}}" --out content/ui.en.json
        else
          echo "upstream/ not cloned: keeping content/ui.en.json"
        fi

  content:assets:
    desc: 'Extract icons, pictures, UI art and audio into content/assets (needs ffmpeg and the media folder, see README; MEDIA=<Assets folder> to override).'
    deps: [deps:install]
    cmd: node tools/converter/src/assets.ts {{if .MEDIA}}--media "{{.MEDIA}}"{{end}} --out content/assets

  content:test:
    desc: "Story tester: static checks + coverage-guided exploration, spoiler-free summary (vars: ID, SECONDS; CLI_ARGS e.g. -- --spoilers)."
    deps: [deps:install]
    vars:
      ID: '{{.ID | default "cost-of-disease"}}'
      SECONDS: '{{.SECONDS | default "120"}}'
    cmd: node tools/story-tester/src/cli.ts {{.ID}} --seconds {{.SECONDS}} {{.CLI_ARGS}}
