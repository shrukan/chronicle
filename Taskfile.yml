# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  PROJECT_NAME: chronicle
  APP_VERSION: "0.0.0" # x-release-please-version

  DEFAULT_IMAGE_NAME: "{{.PROJECT_NAME}}:{{.APP_VERSION}}"
  # docker or podman
  CONTAINER_ENGINE: '{{.CONTAINER_ENGINE | default "docker"}}'
  UPSTREAM_DIR: '{{joinPath .ROOT_DIR "upstream"}}'
  UPSTREAM_REPO: https://github.com/Deusald/MyFathersWork-FanMadeCompanionApp.git

tasks:
  # Dependencies
  deps:install:
    desc: Install all workspace dependencies (npm ci in CI).
    sources: ["package.json", "package-lock.json", "*/package.json"]
    generates: ["node_modules/.package-lock.json"]
    cmds:
      - '{{if .CI}}npm ci{{else}}npm install{{end}}'

  # Docker
  project:build:docker:
    desc: Build the production image.
    vars:
      IMAGE_NAME: '{{.IMAGE_NAME | default .DEFAULT_IMAGE_NAME}}'
    sources: ["Containerfile", "docker/**/*", "package-lock.json", "engine/**/*", "frontend/**/*", "content/**/*.json"]
    generates: [.docker_image_marker.lock]
    cmds:
      # Podman's default OCI format drops HEALTHCHECK; the docker format keeps it.
      - "{{.CONTAINER_ENGINE}} build --file Containerfile {{if eq .CONTAINER_ENGINE \"podman\"}}--format docker {{end}}--tag {{.IMAGE_NAME}} --target runtime ."
      - touch .docker_image_marker.lock

  project:up:prod:
    desc: "Run the production image locally with Docker Compose (vars: PORT, default 8080)."
    deps:
      - task: project:build:docker
    cmd: IMAGE_NAME="{{.DEFAULT_IMAGE_NAME}}" PORT="{{.PORT | default "8080"}}" {{.CONTAINER_ENGINE}} compose up -d

  project:down:prod:
    desc: Stop the locally running production container.
    cmd: IMAGE_NAME="{{.DEFAULT_IMAGE_NAME}}" {{.CONTAINER_ENGINE}} compose down

  project:log:docker:
    desc: Show the container logs.
    cmd: IMAGE_NAME="{{.DEFAULT_IMAGE_NAME}}" {{.CONTAINER_ENGINE}} compose logs chronicle

  # Upstream reference sources
  upstream:clone:
    desc: Clone the original Unity project (reference only, git-ignored).
    status: ["test -d {{.UPSTREAM_DIR}}"]
    cmd: git clone --depth 1 {{.UPSTREAM_REPO}} {{.UPSTREAM_DIR}}

  # Project
  project:typecheck:
    desc: Type-check all workspaces.
    deps: [deps:install]
    cmd: npx tsc -b

  project:test:
    desc: Run unit tests of all workspaces.
    deps: [deps:install]
    cmd: npm test

  project:check:
    desc: Everything CI runs.
    cmds:
      - task: project:typecheck
      - task: project:test
      - task: frontend:test
      - task: frontend:build
      - task: content:test

  # Frontend
  frontend:content:
    desc: Copy the scenario data the app serves into frontend/public/content (git-ignored).
    sources: ["content/*/scenario.json", "content/*/strings.en.json", "content/*/extras.json"]
    generates: ["frontend/public/content/**/*.json"]
    cmds:
      - rm -rf frontend/public/content
      - for f in content/*/scenario.json content/*/strings.en.json content/*/extras.json; do mkdir -p "frontend/public/$(dirname "$f")" && cp "$f" "frontend/public/$f"; done

  frontend:serve:dev:
    desc: Serve the app with live reload (ng serve).
    deps: [deps:install, frontend:content]
    dir: frontend
    cmd: npx ng serve

  frontend:build:
    desc: Production build into build/web.
    deps: [deps:install, frontend:content]
    dir: frontend
    vars:
      OUTPUT_DIR: '{{.OUTPUT_DIR | default (joinPath .ROOT_DIR "build/web")}}'
    sources: ["src/**/*", "public/**/*", "angular.json", "ngsw-config.json", "../engine/src/**/*.ts", "../package-lock.json"]
    generates: ["{{.OUTPUT_DIR}}/browser/index.html"]
    cmd: npx ng build --configuration=production --output-path="{{.OUTPUT_DIR}}"

  frontend:test:
    desc: Unit tests of the app (Vitest).
    deps: [deps:install]
    dir: frontend
    cmd: npx ng test --watch=false

  # Content
  content:convert:
    desc: "Convert the original story scripts into content/ (IDS: scenario ids; only Cost of Disease is in scope for v1)."
    deps: [deps:install, upstream:clone]
    vars:
      IDS: '{{.IDS | default "cost-of-disease"}}'
    cmd: node tools/converter/src/cli.ts --upstream {{.UPSTREAM_DIR}}/UnityOriginalApp --out content --reports build/reports {{.IDS}}

  content:ui:
    desc: Extract the original app's screen texts into content/ui.en.json.
    deps: [deps:install, upstream:clone]
    cmd: node tools/converter/src/ui-text.ts --upstream {{.UPSTREAM_DIR}}/UnityOriginalApp --out content/ui.en.json

  content:assets:
    desc: Extract icons, pictures, UI art and audio into content/assets (needs ffmpeg and the real media files, not Git LFS pointers).
    deps: [deps:install, upstream:clone]
    cmd: node tools/converter/src/assets.ts --upstream {{.UPSTREAM_DIR}}/UnityOriginalApp --out content/assets

  content:test:
    desc: "Story tester: static checks + coverage-guided exploration, spoiler-free summary (vars: ID, SECONDS; CLI_ARGS e.g. -- --spoilers)."
    deps: [deps:install]
    vars:
      ID: '{{.ID | default "cost-of-disease"}}'
      SECONDS: '{{.SECONDS | default "120"}}'
    cmd: node tools/story-tester/src/cli.ts {{.ID}} --seconds {{.SECONDS}} {{.CLI_ARGS}}

  content:smoke:
    desc: "Random playthroughs of a converted scenario (vars: ID, RUNS)."
    vars:
      ID: '{{.ID | default "cost-of-disease"}}'
      RUNS: '{{.RUNS | default "1000"}}'
    cmd: node tools/story-cli/src/smoke.ts --runs {{.RUNS}} --steps 3000 {{.ID}} content

  story:play:
    desc: "Play a scenario in the terminal (vars: ID, PLAYERS, START; CLI_ARGS e.g. -- --short)."
    interactive: true
    vars:
      ID: '{{.ID | default "cost-of-disease"}}'
      PLAYERS: '{{.PLAYERS | default "3"}}'
    cmd: node tools/story-cli/src/play.ts --players {{.PLAYERS}} {{if .START}}--start "{{.START}}"{{end}} {{.CLI_ARGS}} {{.ID}} content
