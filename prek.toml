default_install_hook_types = ["pre-commit", "commit-msg"]

[[repos]]
repo = "https://github.com/alessandrojcm/commitlint-pre-commit-hook"
rev = "v9.24.0"
hooks = [
  { id = "commitlint", name = "commitlint", stages = [
    "commit-msg",
  ], language = "node", additional_dependencies = [
    "@commitlint/config-conventional",
  ] },
]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-toml" },
  # tsconfig files are JSON with comments.
  { id = "check-json", exclude = "(^|/)tsconfig[^/]*\\.json$" },
  { id = "check-yaml" },
  # sources/original/ keeps the original files byte for byte.
  { id = "end-of-file-fixer", exclude = "^sources/original/" },
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"], exclude = "^sources/original/" },
]
