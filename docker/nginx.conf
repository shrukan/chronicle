# Chronicle – static PWA.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Must never be cached by the browser, or PWA updates get stuck. The service worker
    # does the offline caching itself.
    location = /index.html     { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; }
    location = /ngsw.json      { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; }
    location = /ngsw-worker.js { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; }
    location = /safety-worker.js { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; }
    # (a `types {}` block here would replace nginx's whole MIME table)
    location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; }

    # Story data has no content hash in its name.
    location /content/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Build output with content hashes in the file name.
    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Client-side routes.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ /index.html;
    }
}
